<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy Files Demo</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1116;
        color: #dde6fc;
        font-family: Inter, Segoe UI, sans-serif;
      }

      .card {
        width: min(560px, calc(100vw - 32px));
        padding: 22px;
        background: #1b1f29;
        border: 1px solid rgba(173, 186, 212, 0.22);
        border-radius: 14px;
      }

      input[type='file'] {
        width: 100%;
        padding: 10px;
        background: #12161f;
        border: 1px solid rgba(173, 186, 212, 0.4);
        color: #dbe5fd;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Easy Files Demo</h1>
      <p>Click below to trigger the custom Easy Files modal:</p>
      <input type="file" />
    </div>
  </body>
</html>
